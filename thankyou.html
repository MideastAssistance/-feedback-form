<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You for Your Feedback</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    h1 {
      color: #007BFF;
      margin-bottom: 20px;
    }
    p {
      font-size: 18px;
      margin-bottom: 30px;
    }
    .logo-images {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .logo-images img {
      max-height: 100px;
    }
    button {
      background: #007BFF;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Images Section -->
    <div class="logo-images">
      <img alt="Mideast Logo" src="https://agents.mideast-assistance.com/printoutimages/2023%20Logos/Mideast%20Logo.png" style="width: 186px; height: 45px;" />
      <img alt="Ian Logo" src="https://agents.mideast-assistance.com/printoutimages/2023%20Logos/Ian%20Logo.jpg" style="width: 183px; height: 95.6667px;" />
    </div>

    <h1>Thank You for Your Feedback!</h1>
    <p>We appreciate your time and valuable input. Your feedback helps us improve and serve you better.</p>

    <button onclick="window.location.href='https://www.mideast-assistance.com';">Go Back to Homepage</button>
  </div>

</body>
</html>
