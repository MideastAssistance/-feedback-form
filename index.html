<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Assistance System Feedback</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
    .container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #007BFF; }
    label { display: block; margin: 15px 0 5px; font-weight: bold; }
    input, textarea, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
    .grid-layout { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .checkbox-item { display: flex; align-items: center; }
    .checkbox-item input { margin-right: 10px; width: 20px; height: 20px; }
    .dynamic-textarea { display: none; margin-top: 10px; }
    .stars { display: flex; justify-content: center; gap: 5px; margin-top: 20px; }
    .stars label { font-size: 24px; color: #ccc; cursor: pointer; }
    .stars label.filled { color: gold; }
    .average-score { text-align: center; margin-top: 10px; font-size: 18px; }
    button { background: #007BFF; color: white; padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; margin-top: 20px; width: 100%; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <div class="container">
    <form id="feedbackForm" action="https://formsubmit.co/it@mideast-assistance.com" method="POST">
      <table>
        <tr>
          <td><img src="https://agents.mideast-assistance.com/printoutimages/2023%20Logos/Mideast%20Logo.png" style="width: 186px; height: 45px;"></td>
          <td>&nbsp;<img src="https://agents.mideast-assistance.com/printoutimages/2023%20Logos/White.png" style="width: 211.333px; height: 114.333px;"></td>
          <td><img src="https://agents.mideast-assistance.com/printoutimages/2023%20Logos/ian-logo-for-registration-(7x7)-3.jpg" style="width: 183px; height: 95.6667px;"></td>
        </tr>
      </table>

      <h2>Assistance System Feedback Form</h2>

      <!-- Hidden Inputs -->
      <input type="hidden" name="_subject" value="New Assistance System Feedback">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_redirect" value="https://mideastassistance.github.io/-feedback-form/thankyou.html">

      <!-- Basic Info -->
      <label>Your Name</label>
      <input type="text" name="name" required>

      <label>Your Position</label>
      <input type="text" name="position" required>

      <label>Your Email</label>
      <input type="email" name="email" required>

      <!-- Rating Questions with Toggle -->
      <label>1. How would you rate the system overall?</label>
      <select name="rating" required onchange="toggleDescription(this, 'rating-description')">
        <option value="" disabled selected>-Select-</option>
        <option>Excellent</option>
        <option>Good</option>
        <option>Okay</option>
        <option>Bad</option>
        <option>Very bad</option>
      </select>
      <div id="rating-description" class="dynamic-textarea">
        <label>Please describe:</label>
        <textarea name="rating_description" rows="3"></textarea>
      </div>

      <label>2. Is the system easy to use?</label>
      <select name="ease" required onchange="toggleDescription(this, 'ease-description')">
        <option value="" disabled selected>-Select-</option>
        <option>Very easy</option>
        <option>It’s okay</option>
        <option>Sometimes confusing</option>
        <option>Hard to use</option>
      </select>
      <div id="ease-description" class="dynamic-textarea">
        <label>Please describe:</label>
        <textarea name="ease_description" rows="3"></textarea>
      </div>

      <label>3. Do you like how the system looks?</label>
      <select name="ui" required onchange="toggleDescription(this, 'ui-description')">
        <option value="" disabled selected>-Select-</option>
        <option>Yes</option>
        <option>It’s fine</option>
        <option>Needs to look better</option>
      </select>
      <div id="ui-description" class="dynamic-textarea">
        <label>Please describe:</label>
        <textarea name="ui_description" rows="3"></textarea>
      </div>

      <label>4. Are the reports easy to understand?</label>
      <select name="reports" required onchange="toggleDescription(this, 'reports-description')">
        <option value="" disabled selected>-Select-</option>
        <option>Yes</option>
        <option>Somewhat</option>
        <option>Not really</option>
        <option>I don’t use them</option>
      </select>
      <div id="reports-description" class="dynamic-textarea">
        <label>Please describe:</label>
        <textarea name="reports_description" rows="3"></textarea>
      </div>

      <!-- Checkbox Question -->
      <label>5. Which parts of the system do you use the most?</label>
      <div class="grid-layout">
        <div class="checkbox-item"><input type="checkbox" name="features[]" value="Creating new cases">Creating new cases</div>
        <div class="checkbox-item"><input type="checkbox" name="features[]" value="Client/policy info">Client/policy info</div>
        <div class="checkbox-item"><input type="checkbox" name="features[]" value="Sending updates">Sending updates or notes</div>
        <div class="checkbox-item"><input type="checkbox" name="features[]" value="Partner/clinic database">Partner/clinic database</div>
        <div class="checkbox-item"><input type="checkbox" name="features[]" value="Reports">Reports and follow-up</div>
        <div class="checkbox-item"><input type="checkbox" name="features[]" value="Other">Other</div>
      </div>

      <!-- Rating with Stars -->
      <label>6. Please rate the overall experience:</label>
      <div class="stars" id="starRating">
        <label data-value="1">&#9733;</label>
        <label data-value="2">&#9733;</label>
        <label data-value="3">&#9733;</label>
        <label data-value="4">&#9733;</label>
        <label data-value="5">&#9733;</label>
      </div>
      <input type="hidden" name="star_rating" id="star_rating_value">
      <div class="average-score" id="avgScore">Selected: 0 / 5</div>

      <!-- Submit Button -->
      <button type="submit">Submit Feedback</button>
    </form>
  </div>

  <!-- JavaScript -->
  <script>
    function toggleDescription(selectElement, targetId) {
      const target = document.getElementById(targetId);
      if (selectElement.value === 'Bad' || selectElement.value === 'Very bad' || selectElement.value === 'Not really' || selectElement.value === 'Needs to look better' || selectElement.value === 'Sometimes confusing') {
        target.style.display = 'block';
      } else {
        target.style.display = 'none';
        target.querySelector("textarea").value = '';
      }
    }

    const stars = document.querySelectorAll("#starRating label");
    const hiddenInput = document.getElementById("star_rating_value");
    const avgScore = document.getElementById("avgScore");

    stars.forEach(star => {
      star.addEventListener("click", () => {
        const value = parseInt(star.getAttribute("data-value"));
        hiddenInput.value = value;
        avgScore.textContent = `Selected: ${value} / 5`;
        stars.forEach(s => s.classList.remove("filled"));
        for (let i = 0; i < value; i++) {
          stars[i].classList.add("filled");
        }
      });
    });

    // Optional: force redirect on form submission
    document.getElementById("feedbackForm").addEventListener("submit", function (e) {
      // Let FormSubmit handle the request
      // e.preventDefault(); // DO NOT UNCOMMENT THIS unless you're doing a custom AJAX call
    });
  </script>
</body>
</html>
