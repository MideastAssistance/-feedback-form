<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Form with Star Ratings</title>
  <style>
    .stars {
      display: flex;
      gap: 5px;
    }
    .stars label {
      font-size: 30px;
      cursor: pointer;
    }
    .stars .filled {
      color: gold;
    }
    .stars label:hover {
      color: gold;
    }
  </style>
</head>
<body>

<form id="feedbackForm" action="" method="get">
  <h2>Feedback Form</h2>
  
  <div id="rating">
    <label>Rating:</label>
    <div class="stars" id="starsDisplay">
      <label for="star5">☆</label>
      <label for="star4">☆</label>
      <label for="star3">☆</label>
      <label for="star2">☆</label>
      <label for="star1">☆</label>
    </div>
    <input type="radio" name="rating" value="Excellent" id="star5"> Excellent
    <input type="radio" name="rating" value="Good" id="star4"> Good
    <input type="radio" name="rating" value="Okay" id="star3"> Okay
    <input type="radio" name="rating" value="Bad" id="star2"> Bad
    <input type="radio" name="rating" value="Very bad" id="star1"> Very Bad
  </div>

  <div id="ease">
    <label>Ease of use:</label>
    <select name="ease">
      <option value="Very easy">Very easy</option>
      <option value="It’s okay">It’s okay</option>
      <option value="Sometimes confusing">Sometimes confusing</option>
      <option value="Hard to use">Hard to use</option>
    </select>
  </div>

  <div id="ui">
    <label>UI:</label>
    <select name="ui">
      <option value="Yes">Yes</option>
      <option value="It’s fine">It’s fine</option>
      <option value="Needs to look better">Needs to look better</option>
    </select>
  </div>

  <div id="reports">
    <label>Reports:</label>
    <select name="reports">
      <option value="Yes">Yes</option>
      <option value="Somewhat">Somewhat</option>
      <option value="Not really">Not really</option>
      <option value="I don’t use them">I don’t use them</option>
    </select>
  </div>

  <div>
    <label for="additional">Do you have additional comments or feedback?</label>
    <input type="checkbox" id="additional" name="additional">
  </div>
  
  <div id="otherFeatures-description" style="display:none;">
    <textarea name="additional-comments" placeholder="Enter your comments"></textarea>
  </div>

  <div id="avgScore"></div>

  <button type="submit">Submit</button>
</form>

<script>
  const form = document.getElementById('feedbackForm');
  const stars = document.querySelectorAll('#starsDisplay label');
  const avgScore = document.getElementById('avgScore');
  const otherCheckbox = document.getElementById('additional');
  
  const rates = {
    rating: { 'Excellent':5, 'Good':4, 'Okay':3, 'Bad':2, 'Very bad':1 },
    ease: { 'Very easy':5, 'It’s okay':4, 'Sometimes confusing':3, 'Hard to use':2 },
    ui: { 'Yes':5, 'It’s fine':4, 'Needs to look better':3 },
    reports: { 'Yes':5, 'Somewhat':4, 'Not really':3, 'I don’t use them':2 }
  };

  function updateStars() {
    const r = rates.rating[form.rating.value] || 0;
    const e = rates.ease[form.ease.value] || 0;
    const u = rates.ui[form.ui.value] || 0;
    const rp = rates.reports[form.reports.value] || 0;
    const avg = (r + e + u + rp) / 4;
    stars.forEach((s, i) => s.classList.toggle('filled', i < Math.round(avg)));
    avgScore.textContent = avg.toFixed(1);
  }

  function toggleDescription(id) {
    const select = form.querySelector(`[name="${id}"]`);
    const desc = document.getElementById(`${id}-description`);
    let show = false;
    const val = select.value;
    if (id === 'rating') show = ['Bad', 'Very bad'].includes(val);
    else if (id === 'ease') show = ['It’s okay', 'Sometimes confusing', 'Hard to use'].includes(val);
    else if (id === 'ui') show = ['It’s fine', 'Needs to look better'].includes(val);
    else if (id === 'reports') show = ['Somewhat', 'Not really'].includes(val);
    else if (id === 'additional') show = ['Yes'].includes(val);
    desc.style.display = show ? 'block' : 'none';
  }

  form.addEventListener('change', () => {
    updateStars();
    document.getElementById('otherFeatures-description').style.display = otherCheckbox.checked ? 'block' : 'none';
  });

  // Preserve stars after submission using query parameters
  function renderStarsFromQuery() {
    const urlParams = new URLSearchParams(window.location.search);
    const rating = urlParams.get('rating');
    const ease = urlParams.get('ease');
    const ui = urlParams.get('ui');
    const reports = urlParams.get('reports');
    
    if (rating) form.rating.value = rating;
    if (ease) form.ease.value = ease;
    if (ui) form.ui.value = ui;
    if (reports) form.reports.value = reports;
    
    // Trigger changes on page load to update stars
    form.dispatchEvent(new Event('change'));
  }

  window.addEventListener('load', renderStarsFromQuery);
</script>

</body>
</html>
